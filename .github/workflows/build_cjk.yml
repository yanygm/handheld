name: Build Chinese (CJK) Firmware

# Automatically builds the Game Bub firmware with full Chinese (Fusion Pixel)
# font support and uploads a flashable .uf2 artifact.
#
# Mirrors the method used in the gamebub-cjk-handheld project:
#   1. fetch the Fusion Pixel CJK pixel font
#   2. build with build_fusion_pixel_full.sh, which patches i-slint-core so the
#      glyph atlas is stored 1 bit per pixel and bit-packs it (GAMEBUB_PACK_FUSION_PIXEL)
#   3. wrap the application image into a UF2 at the factory partition offset (0x100000)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      revision:
        description: "Hardware revision to build (cargo feature)"
        required: true
        default: "rev4"
        type: choice
        options:
          - rev1
          - rev2
          - rev3
          - rev4

env:
  CARGO_TERM_COLOR: always
  ESP_IDF_VERSION: "v5.4.3"

jobs:
  build-cjk:
    name: Build Fusion Pixel CJK firmware (${{ github.event.inputs.revision || 'rev4' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-${{ env.ESP_IDF_VERSION }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust (Xtensa ESP32-S3)
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - name: Make 'esp' toolchain usable
        # The repo's rust-toolchain.toml pins channel = "esp". Ensure a toolchain with that
        # exact name exists, otherwise cargo fails with "custom toolchain 'esp' is not installed".
        # NOTE: do NOT resolve the installed toolchain via `rustup which rustc` here, because that
        # command honours the rust-toolchain.toml override and would itself fail before we can
        # create the alias.
        run: |
          set -euo pipefail
          if rustup toolchain list | awk '{print $1}' | grep -qx esp; then
            echo "Toolchain 'esp' already present."
          else
            EXISTING="$(rustup toolchain list | awk '{print $1}' | grep -E '^esp' | head -n1)"
            if [ -n "$EXISTING" ]; then
              ESP_ROOT="$(dirname "$(dirname "$(rustup which --toolchain "$EXISTING" rustc)")")"
              rustup toolchain link esp "$ESP_ROOT"
              echo "Linked 'esp' -> $EXISTING"
            else
              echo "No 'esp*' toolchain found; disabling rust-toolchain.toml override."
              mv rust-toolchain.toml /tmp/rust-toolchain.toml.bak
            fi
          fi
          rustup toolchain list
          rustc -vV

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y unzip patch

      - name: Ensure build scripts are executable
        run: chmod +x download_fusion_pixel_font.sh build_fusion_pixel_full.sh make_uf2.py || true

      - name: Download Fusion Pixel CJK font
        run: bash ./download_fusion_pixel_font.sh

      - name: Populate cargo registry sources
        # build_fusion_pixel_full.sh patches i-slint-core-1.12.1, whose extracted
        # source must already live in the cargo registry cache. A release build
        # extracts (and compiles) it, so the later patched build can reuse it.
        run: cargo build --release

      - name: Build firmware with bit-packed CJK font
        run: bash ./build_fusion_pixel_full.sh --release --features=${{ github.event.inputs.revision || 'rev4' }}

      - name: Convert application image to UF2
        run: |
          python3 make_uf2.py \
            target/xtensa-esp32s3-espidf/release/handheld.bin \
            gamebub-cjk-${{ github.event.inputs.revision || 'rev4' }}.uf2 \
            --base 0x100000 --hardware-major 4 --product 1 \
            --commit ${{ github.sha }}

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamebub-firmware-cjk-${{ github.event.inputs.revision || 'rev4' }}
          path: |
            gamebub-cjk-${{ github.event.inputs.revision || 'rev4' }}.uf2
            target/xtensa-esp32s3-espidf/release/handheld.bin
          if-no-files-found: error
