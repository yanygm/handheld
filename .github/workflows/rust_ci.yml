name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --all-targets --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Ensure 'esp' toolchain alias exists
        # The repo's rust-toolchain.toml pins channel = "esp"; ensure an alias with that
        # exact name exists in case the action installed a versioned toolchain name.
        run: |
          if ! rustup toolchain list | awk '{print $1}' | grep -qx esp; then
            ESP_ROOT="$(dirname "$(dirname "$(rustup which rustc)")")"
            rustup toolchain link esp "$ESP_ROOT"
          fi
          rustup toolchain list
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
