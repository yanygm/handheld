name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: build
            args: --release
          - command: fmt
            args: --all -- --check --color always
          - command: clippy
            args: --all-targets --all-features --workspace -- -D warnings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Setup Rust
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          # Pin to the Rust version this project targets (rust-version = "1.93").
          # "latest" pulls a much newer 2026-era toolchain whose Xtensa LLVM backend
          # crashes with "Cannot select XtensaISD::PCREL_WRAPPER" on Slint-generated code.
          version: "1.93.0.0"
          default: true
          buildtargets: esp32s3
          ldproxy: true
      - name: Make 'esp' toolchain usable
        # The repo's rust-toolchain.toml pins channel = "esp". Ensure a toolchain with that
        # exact name exists, otherwise cargo fails with "custom toolchain 'esp' is not installed".
        # NOTE: do NOT resolve the installed toolchain via `rustup which rustc` here, because that
        # command honours the rust-toolchain.toml override and would itself fail before we can
        # create the alias.
        run: |
          set -euo pipefail
          if rustup toolchain list | awk '{print $1}' | grep -qx esp; then
            echo "Toolchain 'esp' already present."
          else
            EXISTING="$(rustup toolchain list | awk '{print $1}' | grep -E '^esp' | head -n1)"
            if [ -n "$EXISTING" ]; then
              ESP_ROOT="$(dirname "$(dirname "$(rustup which --toolchain "$EXISTING" rustc)")")"
              rustup toolchain link esp "$ESP_ROOT"
              echo "Linked 'esp' -> $EXISTING"
            else
              echo "No 'esp*' toolchain found; disabling rust-toolchain.toml override."
              mv rust-toolchain.toml /tmp/rust-toolchain.toml.bak
            fi
          fi
          rustup toolchain list
          rustc -vV
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}
